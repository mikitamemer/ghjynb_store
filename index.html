
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101016">
  <title>DOORS Store</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: #101016;
      color: #fff;
      font-family: Arial, sans-serif;
    }

    header {
      text-align: center;
      padding: 28px 16px;
      background: linear-gradient(135deg, #24113d, #11111a);
      border-bottom: 1px solid #553477;
    }

    header h1 {
      margin: 0 0 8px;
      color: #d4a6ff;
      font-size: 30px;
    }

    header p {
      color: #c6bfd0;
      margin: 0;
    }

    main {
      max-width: 900px;
      margin: auto;
      padding: 18px;
    }

    .notice {
      padding: 13px;
      background: #211b2b;
      border: 1px solid #51366d;
      border-radius: 12px;
      margin-bottom: 18px;
      color: #e2d5f4;
      font-size: 14px;
      line-height: 1.5;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #484052;
      border-radius: 10px;
      background: #1b1a23;
      color: white;
      font-size: 16px;
      margin-bottom: 18px;
    }

    .products {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }

    .product {
      min-width: 0;
      overflow: hidden;
      background: #1b1a23;
      border: 1px solid #35313f;
      border-radius: 14px;
      padding: 12px;
    }

    .product img {
      width: 100%;
      height: 145px;
      object-fit: contain;
      background: #13121a;
      border-radius: 10px;
    }

    .product h2 {
      font-size: 16px;
      margin: 12px 0 7px;
    }

    .description {
      min-height: 32px;
      color: #aaa4b6;
      font-size: 12px;
    }

    .price {
      color: #d5a6ff;
      font-size: 18px;
      font-weight: bold;
      margin: 12px 0;
    }

    button {
      width: 100%;
      padding: 12px 8px;
      background: #8c45d8;
      border: 0;
      border-radius: 9px;
      color: white;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
    }

    button:active { opacity: .8; }

    footer {
      text-align: center;
      padding: 24px 12px;
      color: #8f899b;
      font-size: 12px;
    }

    @media (max-width: 350px) {
      .products { grid-template-columns: 1fr; }
    }
  </style>
</head>

<body>
  <header>
    <h1>DOORS STORE</h1>
    <p>Магазин игровых предметов</p>
  </header>

  <main>
    <div class="notice">
      ⭐ Цены указаны в Telegram Stars.
      Нажатие на кнопку создаёт запрос на заказ.
      Оплата пока не подключена автоматически.
    </div>

    <input
      id="search"
      type="search"
      placeholder="🔎 Найти предмет..."
      aria-label="Поиск предметов"
    >

    <div class="products" id="products"></div>
  </main>

  <footer>
    Фан-магазин. Неофициальный проект сообщества DOORS.
  </footer>

  <script>
    // ВСТАВЬ СЮДА username своего Telegram-бота
    // Без символа @. Например: my_store_bot
    const BOT_USERNAME = "ghjynbot";

    const items = [
      {
        id: "skeleton_key",
        name: "Skeleton Key",
        price: 10,
        description: "Скелетный ключ",
        image:
          "https://static.wikia.nocookie.net/doors-game/images/c/cd/Skeletonkeyimage.png/revision/latest?cb=20241022090900",
        page: "https://doorswiki.com/wiki/skeleton-key/"
      },
      {
        id: "gween_soda",
        name: "Gween Soda",
        price: 20,
        description: "Зелёная газировка",
        image:
          "https://media.sketchfab.com/models/6435c50365a54522aa58157b5b0f6b94/thumbnails/9f8e678d36a446ec80956a56be1e0536/0adf578fd17246a6bbea1113d6af5edf.jpeg",
        page: "https://doors-game.fandom.com/wiki/Gween_Soda"
      },
      {
        id: "starlight_jug",
        name: "Starlight Jug",
        price: 15,
        description: "Кувшин звёздного света",
        image: "",
        page: "https://doors-entities.fandom.com/wiki/Items"
      },
      {
        id: "lotus_flower",
        name: "Lotus Flower",
        price: 25,
        description: "Лотос",
        image: "",
        page: "https://doorswiki.com/wiki/lotus/"
      },
      {
        id: "donut",
        name: "Donut",
        price: 10,
        description: "Пончик",
        image: "",
        page: "https://doorswiki.com/wiki/donut/"
      }
    ];

    const products = document.getElementById("products");
    const search = document.getElementById("search");

    function renderItems(filter = "") {
      products.replaceChildren();

      const filtered = items.filter(item =>
        item.name.toLowerCase().includes(filter.toLowerCase())
      );

      filtered.forEach(item => {
        const card = document.createElement("article");
        card.className = "product";

        const image = document.createElement("img");
        image.alt = item.name;
        image.loading = "lazy";

        if (item.image) {
          image.src = item.image;
          image.onerror = () => {
            image.onerror = null;
            image.src = "";
            image.alt = "Изображение недоступно";
            image.style.objectFit = "contain";
          };
        } else {
          image.alt = "Открой страницу предмета, чтобы посмотреть изображение";
        }

        const title = document.createElement("h2");
        title.textContent = item.name;

        const description = document.createElement("div");
        description.className = "description";
        description.textContent = item.description;

        const price = document.createElement("div");
        price.className = "price";
        price.textContent = `⭐ ${item.price} Stars`;

        const button = document.createElement("button");
        button.textContent = "Заказать";

        button.addEventListener("click", () => {
          if (BOT_USERNAME === "YOUR_BOT_USERNAME") {
            alert(
              "Сначала укажи username своего Telegram-бота в коде."
            );
            return;
          }

          const message =
            `Хочу заказать: ${item.name}. Цена: ${item.price} Stars.`;

          const startPayload = `order_${item.id}`;

          const url =
            `https://t.me/${BOT_USERNAME}?start=${startPayload}`;

          window.open(url, "_blank");
        });

        card.append(image, title, description, price, button);
        products.appendChild(card);
      });

      if (filtered.length === 0) {
        products.textContent = "Предметы не найдены.";
      }
    }

    search.addEventListener("input", () => {
      renderItems(search.value);
    });

    renderItems();
  </script>
</body>
      </html>
